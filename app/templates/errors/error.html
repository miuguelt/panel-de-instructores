{% extends "base.html" %}
{% block title %}{{ codigo }} - {{ titulo }} - SENA Control{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
    <span class="error-code">{{ codigo }}</span>
    <h1 id="error-title">{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a href="{{ url_for('instructor.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
       class="btn btn-primary">Volver a un lugar seguro</a>
</section>
{% endblock %}
