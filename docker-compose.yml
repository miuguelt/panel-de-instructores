services:
  app:
    build: .
    # Sin container_name: Coolify asigna el suyo (app-<uuid>-<ts>) y un nombre
    # fijo provoca colisiones al redesplegar sobre el contenedor anterior.
    restart: unless-stopped
    # Pass-through sin `${}`: Docker Compose NO interpola estos valores, así que
    # un `$` dentro de SECRET_KEY o DB_PASSWORD llega íntegro al contenedor.
    # Con `${VAR}` Compose expandía `$hcQX...` como variable de shell y vaciaba
    # el secreto. Los valores se definen en Coolify UI → Environment Variables.
    environment:
      - FLASK_ENV
      - SECRET_KEY
      - DATABASE_URL
      - REDIS_URL
      - UPLOAD_FOLDER
      - MAX_CONTENT_LENGTH
      - ADSO_ADMIN_EMAIL
      - ADSO_ADMIN_PASSWORD
      - ADSO_ADMIN_NOMBRE
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_NAME
      - DB_PASSWORD
    volumes:
      - uploads:/app/uploads
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - coolify

volumes:
  uploads:
    name: adso_uploads

networks:
  coolify:
    external: true
