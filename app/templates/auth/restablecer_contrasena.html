<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Crear contraseña nueva - SENA Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
<div class="auth-container">
    <main class="auth-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages" aria-live="polite">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <div class="auth-header">
            <div class="auth-logo" aria-hidden="true">S</div>
            <h1>Crear contraseña nueva</h1>
            <p>Elige una contraseña de al menos 12 caracteres.</p>
        </div>

        <form method="POST" class="auth-form" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" id="token" name="token" value="{{ token or '' }}">
            <div class="form-group">
                <label for="password">Contraseña nueva</label>
                <input type="password" id="password" name="password" minlength="12"
                       maxlength="128" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirmacion">Confirma la contraseña</label>
                <input type="password" id="confirmacion" name="confirmacion" minlength="12"
                       maxlength="128" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Guardar contraseña</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.solicitar_recuperacion') }}">Solicitar otro enlace</a>
        </div>
    </main>
</div>
<script src="{{ url_for('static', filename='js/password-reset.js') }}" defer></script>
</body>
</html>
