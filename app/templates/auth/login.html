{% extends "base.html" %}
{% block title %}Iniciar Sesión - SENA Control{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">S</div>
            <h1>SENA Control Académico</h1>
            <p>Regional Santander</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="correo">Correo institucional</label>
                <input type="email" id="correo" name="correo" placeholder="tu.correo@sena.edu.co" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            <p>¿Eres instructor nuevo?</p>
            <a href="{{ url_for('auth.registro') }}" class="btn btn-outline btn-full">Registrarme</a>
        </div>
    </div>
</div>
{% endblock %}
