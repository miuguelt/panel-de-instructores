services:
  app:
    build: .
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH}
      - ADSO_ADMIN_EMAIL=${ADSO_ADMIN_EMAIL}
      - ADSO_ADMIN_PASSWORD=${ADSO_ADMIN_PASSWORD}
      - ADSO_ADMIN_NOMBRE=${ADSO_ADMIN_NOMBRE}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - coolify

volumes:
  uploads:
    name: adso_uploads

networks:
  coolify:
    external: true
