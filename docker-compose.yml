services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Las variables sensibles se pasan por nombre, sin interpolarlas en
      # Compose. Así los caracteres '$', '@', ':' y '/' de las credenciales
      # no se reinterpretan durante el despliegue de Coolify.
      - SECRET_KEY
      - DATABASE_URL
      - RUN_MIGRATIONS=true
      - REDIS_URL
      - ADSO_ADMIN_EMAIL
      - ADSO_ADMIN_PASSWORD
      - ADSO_ADMIN_NOMBRE
      - SMTP_HOST
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - WTF_CSRF_TIME_LIMIT
      - LOG_LEVEL
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      # Gunicorn lee WEB_CONCURRENCY al importar su propio módulo, antes de
      # que Flask pueda normalizar el entorno. Nunca debe recibir una cadena
      # vacía desde Coolify.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-8}
      - FLASK_ENV=${FLASK_ENV:-production}
      - IMPORTACIONES_ASINCRONAS=${IMPORTACIONES_ASINCRONAS:-true}
      - IMPORT_QUEUE_NAME=${IMPORT_QUEUE_NAME:-adso:importaciones}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-52428800}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - coolify

  worker:
    build: .
    restart: unless-stopped
    environment:
      - PROCESS_TYPE=worker
      - RUN_MIGRATIONS=false
      - SECRET_KEY
      - DATABASE_URL
      - REDIS_URL
      - ADSO_ADMIN_EMAIL
      - ADSO_ADMIN_PASSWORD
      - ADSO_ADMIN_NOMBRE
      - SMTP_HOST
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - WTF_CSRF_TIME_LIMIT
      - LOG_LEVEL
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      - IMPORTACIONES_ASINCRONAS=${IMPORTACIONES_ASINCRONAS:-true}
      - IMPORT_QUEUE_NAME=${IMPORT_QUEUE_NAME:-adso:importaciones}
      # El timeout de lectura debe ser mayor que el bloqueo de BLPOP. Antes era
      # 3s vs 30s y el worker se reconectaba continuamente con la cola vacía.
      - WORKER_BLPOP_TIMEOUT=${WORKER_BLPOP_TIMEOUT:-30}
      - WORKER_SOCKET_TIMEOUT=${WORKER_SOCKET_TIMEOUT:-35}
      - FLASK_ENV=${FLASK_ENV:-production}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-52428800}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; raise SystemExit(0 if os.path.exists('/tmp/adso-worker-ready') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - coolify

volumes:
  # Volumen NOMBRADO (no bind, no anónimo) y montado por `app` y `worker` en
  # /app/uploads, que es el UPLOAD_FOLDER de ambos. Ahí viven evidencias,
  # materiales, soportes y los Excel en cola: sobreviven a `up --build`, a un
  # redeploy de Coolify y a un cambio de imagen, porque nada de eso toca los
  # volúmenes. Lo único que sí los borra es un `docker compose down -v` (o el
  # "delete volumes" de Coolify), así que el respaldo periódico sigue siendo
  # necesario; el procedimiento está en app/services/ARCHIVOS_STANDARD.md.
  # La verificación automática de todo esto vive en
  # tests/test_persistencia_despliegue.py.
  uploads:
    name: adso_uploads

networks:
  coolify:
    external: true
