<section class="timeline-card {% if cronograma.fase == 'finalizada' %}timeline-finished{% endif %}">
    {% set tyt = progreso_tyt(ficha, aprendiz if request.endpoint == 'aprendiz.panel' else none) %}
    {% if not tyt %}
    <div class="timeline-card-heading">
        <div>
            <span class="eyebrow">Avance de la ficha</span>
            <h2>Etapa lectiva y resultados</h2>
        </div>
    </div>
    {% endif %}
    {% include 'tyt/_tarjeta.html' %}
</section>
