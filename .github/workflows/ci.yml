name: DevBrain CI - GitFlow Continuous Integration (Panel de Instructores)

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'bugfix/**'
      - 'support/**'
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - 'bugfix/**'
      - 'support/**'
  workflow_dispatch:

concurrency:
  group: ci-panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Flask Test Suite (Panel de Instructores)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run JavaScript chat tests and function coverage
        run: node --experimental-test-coverage --test-coverage-functions=100 --test-coverage-include=app/static/js/grupo_chat.js --test tests_js/grupo_chat.test.cjs

      - name: Verificar navegación de planeación y cobertura de funciones
        run: node --experimental-test-coverage --test-coverage-functions=100 --test-coverage-include=app/static/js/planeacion_navegacion.js --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage-planeacion.lcov --test tests_js/planeacion_navegacion.test.cjs

      - name: Verificar modales y ventanas emergentes
        run: node --experimental-test-coverage --test-coverage-functions=100 --test-coverage-include=app/static/js/modal-system.js --test tests_js/modal_system.test.cjs

      - name: Guardar cobertura de navegación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-planeacion-js
          path: coverage-planeacion.lcov
          if-no-files-found: error
          retention-days: 14

      - name: Run Tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          echo "Ejecutando suite de pruebas en Panel de Instructores..."
          python -m pytest tests/ -v --tb=short --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=75

      - name: Verificar que la suite ejecute todas las funciones
        run: python scripts/check_function_coverage.py --source app --coverage-xml coverage.xml

      - name: Agregar reporte de cobertura al resumen
        if: always() && hashFiles('coverage.xml') != ''
        run: python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Report Summary
        if: always()
        run: |
          echo "### 📋 Panel de Instructores CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado**: ${{ job.status == 'success' && '✅ Aprobado' || '❌ Fallido' }}" >> $GITHUB_STEP_SUMMARY
